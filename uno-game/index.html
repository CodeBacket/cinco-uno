<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinco UNO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Cinco UNO</h1>
    <p class="subtitle">Phase-01 architecture scaffold</p>
  </header>

  <main>
    <section id="menu-view" aria-labelledby="menu-heading">
      <h2 id="menu-heading">Game Setup</h2>
      <p>Choose AI opponent count and start a round.</p>
    </section>

    <section id="table-view" aria-labelledby="table-heading" hidden>
      <h2 id="table-heading">Game Table</h2>
      <p>Round state and player hands render here in later phases.</p>
    </section>
  </main>

  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
