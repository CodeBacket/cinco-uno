<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>UNO Card Game</h1>
  </header>

  <main>
    <section class="game-board" aria-label="Game area">
      <p id="status" class="status">Preparing game...</p>

      <div class="counters" aria-label="Card counters">
        <div class="counter">Draw pile: <span id="draw-count">0</span></div>
        <div class="counter">CPU hand: <span id="cpu-count">0</span></div>
        <div class="counter">Player hand: <span id="player-count">0</span></div>
      </div>

      <div>
        <h2>Your hand</h2>
        <div id="player-hand" class="player-hand" aria-live="polite"></div>
      </div>

      <button id="draw-button" type="button">Draw Card</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
