<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>UNO Card Game</h1>
  </header>

  <main>
    <section class="game-container" aria-label="UNO game container">
      <div class="opponent-area" aria-label="Opponent hand area">
        Opponent Area
      </div>

      <div class="table-area" aria-label="Table area">
        <div class="pile draw-pile" aria-label="Draw pile">Draw Pile</div>
        <div class="pile discard-pile" aria-label="Discard pile">Discard Pile</div>
      </div>

      <div class="player-area" aria-label="Player hand area">
        Player Area
      </div>

      <div class="controls-area" aria-label="Game controls area">
        <button type="button">Draw Card</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
